name: Build AppImage
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Build portable Linux application
        run: |
          docker build -f packaging/appimage/Containerfile -t speedbuilder-appimage .
          mkdir -p dist .appimage-work
          docker run --rm -e SOURCE_REVISION="$GITHUB_SHA" -v "$PWD:/source:ro" -v "$PWD/dist:/out" -v "$PWD/.appimage-work:/work" speedbuilder-appimage bash /source/packaging/appimage/build.sh /out /work
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpeedBuilderForever-AppImage
          path: dist/*
          if-no-files-found: error
